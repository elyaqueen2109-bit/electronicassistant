<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Speaking Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Библиотеки -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --bg-space: #09090b;
    --bg-card: rgba(24, 24, 27, 0.7);
    --primary: #8B5CF6;
    --primary-glow: rgba(139, 92, 246, 0.5);
    --secondary: #06B6D4;
    --secondary-glow: rgba(6, 182, 212, 0.5);
    --text-main: #F8FAFC;
    --text-light: #94A3B8;
    --danger: #F43F5E;
    --border: rgba(255, 255, 255, 0.1);
  }
  
  * { box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background-color: var(--bg-space);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.15), transparent 25%);
    color: var(--text-main);
    margin: 0; padding: 20px;
    display: flex; justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .container {
    background: var(--bg-card);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    width: 100%; max-width: 850px; padding: 40px;
    border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    position: relative;
  }

  .floating-title {
    font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900;
    text-align: center; margin-bottom: 30px;
    background: linear-gradient(to right, var(--secondary), var(--primary));
    -webkit-background-clip: text; color: transparent;
    animation: float 6s ease-in-out infinite; text-transform: uppercase; letter-spacing: 2px;
  }

  @keyframes float {
    0% { transform: translateY(0px); text-shadow: 0 0 10px var(--primary-glow); }
    50% { transform: translateY(-8px); text-shadow: 0 0 20px var(--primary-glow), 0 0 30px var(--secondary-glow); }
    100% { transform: translateY(0px); text-shadow: 0 0 10px var(--primary-glow); }
  }

  .screen { display: none; animation: fadeIn 0.4s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* --- MENU --- */
  .menu-options { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
  .main-btn {
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #8B5CF6, #06B6D4);
    color: white; border: none; padding: 20px 40px; font-size: 18px; font-weight: 700; border-radius: 15px; cursor: pointer;
    transition: all 0.3s ease; text-transform: uppercase; box-shadow: 0 10px 20px var(--primary-glow);
  }
  .main-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--primary-glow); }
  
  .themes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; max-height: 400px; overflow-y: auto; padding: 10px;
  }
  .themes-grid::-webkit-scrollbar { width: 6px; }
  .themes-grid::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
  
  .theme-btn {
    background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border);
    padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 600; text-align: left; transition: 0.2s;
  }
  .theme-btn:hover { background: rgba(139, 92, 246, 0.2); border-color: var(--primary); }

  .pdf-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-family: 'Orbitron'; margin-top: 20px; width: 100%; }
  .pdf-btn:hover { background: rgba(255,255,255,0.2); }

  /* --- CARD UI --- */
  .card-container {
    perspective: 1000px;
    width: 100%;
    min-height: 450px;
    margin: 0 auto;
  }

  .card {
    background: rgba(30, 41, 59, 0.8);
    border: 2px solid var(--secondary);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(100px) rotateY(20deg); }
    to { opacity: 1; transform: translateX(0) rotateY(0deg); }
  }

  .card-header { display: flex; justify-content: space-between; align-items: center; color: var(--secondary); font-family: 'Orbitron'; font-weight: bold; }
  .back-btn { background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 16px; }
  .back-btn:hover { color: var(--danger); }
  
  .question-text {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.4;
    min-height: 80px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .speak-btn {
    background: var(--primary); border: none; border-radius: 50%; width: 40px; height: 40px;
    cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .speak-btn:hover { background: #7C3AED; }

  .answer-area { display: flex; flex-direction: column; gap: 15px; }
  textarea {
    width: 100%; height: 80px; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
    color: white; padding: 15px; border-radius: 10px; font-family: inherit; resize: none;
  }
  textarea:focus { outline: none; border-color: var(--primary); }

  .controls { display: flex; gap: 10px; margin-top: 10px; }
  .btn {
    flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; transition: 0.2s;
  }
  .btn-rec { background: var(--danger); color: white; }
  .btn-rec.recording { animation: pulse-red 1.5s infinite; }
  @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }
  .btn-next { background: var(--primary); color: white; }

  .timer-circle {
    width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--danger);
    display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-size: 24px; font-weight: bold; color: var(--danger);
    margin: 0 auto;
  }

  /* --- FINISH SCREEN --- */
  .finish-box { text-align: center; }
  .finish-box h2 { color: var(--secondary); margin-bottom: 30px; }
  .mp3-btn {
    background: var(--secondary); color: #000; padding: 20px 40px; font-family: 'Orbitron'; font-size: 18px; font-weight: bold;
    border-radius: 15px; cursor: pointer; border: none; box-shadow: 0 0 20px var(--secondary-glow); margin-bottom: 20px;
  }
  .mp3-btn:hover { background: #22D3EE; transform: scale(1.02); }

</style>
</head>
<body>

<div class="container">

  <!-- MENU -->
  <div id="screen-menu" class="screen active">
    <h1 class="floating-title">Space Speaking</h1>
    <div class="menu-options">
      <button class="main-btn" onclick="startMode('random')">🎲 Random Mode</button>
    </div>
    <h3 style="text-align:center; color:var(--text-light); margin-bottom: 15px;">Or choose a topic:</h3>
    <div class="themes-grid" id="themes-grid"></div>
    
    <button class="pdf-btn" onclick="generatePDF()">📄 Download All 40 Cards (PDF)</button>
  </div>

  <!-- EXAM -->
  <div id="screen-exam" class="screen">
    <div class="card-container">
      <div class="card" id="card-ui">
        <div class="card-header">
          <button class="back-btn" onclick="backToMenu()">← MENU</button>
          <span id="card-topic">Topic</span>
          <span id="card-progress">1 / 6</span>
        </div>
        
        <div class="question-text" id="card-question-container">
          <button class="speak-btn" onclick="speakQuestion()" title="Listen to question">🔊</button>
          <span id="card-question-text">Loading question...</span>
        </div>
        
        <div class="timer-circle" id="card-timer">40</div>

        <div class="answer-area">
          <textarea id="text-answer" placeholder="Type your answer here (optional)..."></textarea>
          <div class="controls">
            <button class="btn btn-rec" id="rec-btn" onclick="toggleRecording()">🎤 Start Recording</button>
            <button class="btn btn-next" onclick="nextCard()">Next ➔</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FINISH -->
  <div id="screen-finish" class="screen">
    <div class="finish-box">
      <h2>Mission Complete!</h2>
      <p style="margin-bottom: 30px; color: var(--text-light);">You have answered all questions.</p>
      <button class="mp3-btn" onclick="downloadMp3()">⬇️ Download All Answers (MP3)</button>
      <br>
      <button class="main-btn" onclick="backToMenu()" style="padding: 15px 30px; font-size: 14px;">Return to Base</button>
    </div>
  </div>

</div>

<script>
  // --- БАЗА ВОПРОСОВ (ВСЕ 40 ТЕМ) ---
  const THEMES_DATA = [
    { title: "1. School", questions: [
      "How many days a week do you go to school?", "What subjects are you good at?", "What sports facilities do you have in your school?", "What after-school activities does your school offer?", "What do you like most about your school?", "What would you recommend to a student who wants to improve his or her school results?"
    ]},
    { title: "2. Holidays and Special Days", questions: [
      "How old are you?", "In what season do you have your birthday?", "How do you usually celebrate your birthday?", "What is the best birthday present you have ever had?", "What other holidays and special days are celebrated in your family?", "What, from your point of view, is the best birthday present for a teenager?"
    ]},
    { title: "3. Weekends", questions: [
      "How old are you?", "What is your favourite day of the week? Why do you like it?", "When do you usually get up at weekends?", "How do you usually spend your weekends?", "What sport or hobby do you think you might like to try in your future?", "What would you recommend to a student who wants to make his or her weekend more interesting?"

    { title: "4. Attitude to school events", questions: [

    ]},
    { title: "5. TV and TV programmes", questions: [
      "What do you enjoy doing in your free time?", "How often do you go to the cinema or to the theater?", "How much time do you usually watch TV every day?", "What TV programs are popular in your family?", "Do you prefer TV or the Internet? Why?", "What TV program would you recommend your friends watch?"
    ]},
    { title: "6. Teenagers Daily routine", questions: [
      "How many days a week do you go to school?", "When do you go to bed in the evening?", "How do you spend your mornings?", "What means of transport do you use to get to school?", "What do you usually have for lunch?", "What would you recommend to a teenager who wants to stay fit and healthy?"
    ]},
    { title: "7. Learning foreign languages", questions: [
      "What foreign languages can you learn at your school?", "How many English lessons a week do you have?", "For what reasons do people learn foreign languages nowadays?", "What is the most effective way to learn a foreign language in your opinion?", "Do you think English will be useful for you in the future? In what way?", "What language would you recommend your English-speaking friend learn? Why?"
    ]},
    { title: "8. Free time", questions: [
      "How much free time do you have on week days?", "How do you and your friends usually spend your free time?", "Who do you prefer to spend your free time with?", "What after school activities do you take part in?", "Do you think everyone should find some time for doing sports? Why?", "What hobby would you do if you had more free time?"
    ]},
    { title: "9. Sports at school", questions: [
      "How many Physical Education lessons a week do you have?", "What sports facilities do you have at school?", "What do you do in your Physical Education lessons?", "What sports do you do regularly?", "Do you think the winter is a good season for doing sports or not? Why?", "What would you recommend to a teenager who wants to stay fit and healthy?"
    ]},
    { title: "10. Attitude to Sports", questions: [
      "How many lessons of PE (Physical Education) do you have a week?", "What sports facilities do you have in your school?", "What sport do you do regularly?", "What winter sports are popular with you and your friends?", "Would you like to do any extreme sports? Why or why not?", "What would you recommend to a teenager who wants to be healthy and fit?"
    ]},
    { title: "11. Using the Internet", questions: [
      "How old are you?", "How much time do you spend on the Internet every day?", "What do you use the Internet for?", "What do you do in Information Technology or Computer Studies lessons?", "Why are computer skills useful for everyone?", "What would you recommend to a person who spends too much time on the Internet?"
    ]},
    { title: "12. Holidays and Special Days 2", questions: [
      "What is your favourite season? Why do you like it?", "There are a lot of different holidays during the year. What holidays are the most popular in Russia?", "What is your favourite holiday? Why do you like it?", "How do you usually celebrate your favourite holiday?", "What season is the best for visiting the place where you live? Why?", "What would you recommend to a person who has got a present he or she doesn't need?"
    ]},
    { title: "13. Future Career", questions: [

    { title: "15. Spend holidays", questions: [

    { title: "16. School holidays", questions: [
      "What grade are you in?", "How many school holidays do you have?", "What school holidays do you like best of all?", "Why do most teenagers enjoy school holidays so much?", "What do you usually do during your summer holidays?", "Do you think it is a good idea for a teenager to take a part-time job during the summer holidays? Why?"
    ]},
    { title: "17. Daily Routines", questions: [
      "What time do you usually go to bed in the evening?", "How much time do you spend doing your homework?", "What sports do you do regularly?", "What do you do to help your parents about the house?", "How do you spend your weekends?", "What would you like to change in your daily routine?"
    ]},
    { title: "18. Sports", questions: [
      "What do you do in your Physical Education lessons at school?", "Do you do your morning exercises or not? Why?", "What sports do you like playing?", "What sports competitions do you enjoy watching?", "Is there any sport you would like to play professionally? Why?", "What would you recommend to a teenager who wants to stay fit and healthy?"
    ]},
    { title: "19. School 2", questions: [
      "What grade are you in?", "How many classes a day do you usually have?", "What sports facilities are there in your school?", "What is your school uniform like?", "What school events do you have during the school year?", "What would you like to improve in your school?"
    ]},
    { title: "20. City, Town or Village", questions: [
      "How long have you been living in your city, town or village?", "What is the place where you live famous for?", "When was your city, town or village founded?", "What season is the best for visiting your city, town or village and why?", "What is your favourite place in your city, town or village? Why do you like it?", "What place in your hometown would you recommend visiting?"
    ]},
    { title: "21. English language learning", questions: [
      "What is your favourite school subject?", "When did you start learning English?", "What do you do in your English lessons?", "Do you find learning English easy or difficult? Why?", "What other foreign language would you like to learn and why?", "What would you recommend a person do to improve his or her English?"
    ]},
    { title: "22. Eating habits", questions: [
      "How many meals a day do you usually have?", "What is your favourite food?", "What do you usually have for lunch at school?", "Do you prefer fast food or home made food? Why?", "Would you like to take part in a TV cookery show? For example, cooking your favourite dish in a TV studio? Why?", "What would you recommend to a teenager who wants to keep fit?"
    ]},
    { title: "23. School 3", questions: [
      "How many lessons do you usually have?", "What subject do you find the most difficult?", "What is your favourite week day? Why do you like it?", "What sports facilities do you have in your school?", "Do you think school uniform is necessary or not? Why do you think so?", "What would you recommend your friends do to improve their English?"
    ]},
    { title: "24. Shopping and shopping centers", questions: [
      "Who usually does the shopping in your family?", "What can you buy in your nearest shopping center?", "How often do you usually go shopping?", "Why are shopping centers so popular nowadays?", "Why do some people hate shopping?", "What time would you recommend that busy people should go shopping?"
    ]},
    { title: "25. Mobile phones", questions: [
      "How old were you when you got your mobile phone?", "What do you use your mobile phone for, apart from talking?", "Who do you usually send SMS-s to?", "How can you use mobile phones to learn foreign languages?", "Where do you usually switch off your mobile phone?", "Why are most teachers against using mobile phones at school?"
    ]},
    { title: "26. Music and the other arts", questions: [
      "What kind of music do you usually listen to?", "What musical instrument would you like to learn to play?", "What clubs or societies can you attend in your school?", "How often do you have school concerts and performances?", "What would you prefer: going to the theater or watching a film at home? Why?", "What would you recommend to your friends who want to make their free time more interesting?"
    ]},
    { title: "27. Shopping and clothes", questions: [
      "What color of clothes do you prefer wearing?", "What clothes do you usually wear?", "How often do you go shopping for clothes?", "Who do you usually go shopping with?", "Do you have to wear a school uniform? If so, what is it like?", "Does a career of a fashion designer attract you or not? Why?"
    ]},
    { title: "28. Reading", questions: [
      "How old were you when you learned to read?", "What do you like to read about?", "Who is your favourite writer?", "What do you usually do in Literature lessons?", "What do you like to do in your free time apart from reading?", "What books do you prefer: printed books or e-books? Why?"
    ]},
    { title: "29. Mass Media", questions: [
      "Where do you prefer to get news from: radio, newspapers, the Internet or some other source?", "Who listens to the radio in your family?", "What kind of TV programs do you like to watch?", "How often do you buy a newspaper or a magazine?", "For what purposes do you use the Internet?", "Why, in your opinion, do a lot of people prefer learning the news from the Internet?"
    ]},
    { title: "30. Ecological problems", questions: [
      "Where would you like to live: in a big city or in the country?", "What are the advantages of living in the country?", "What is the main ecological problem in the place where you live?", "Do you and your friends care about ecological problems? Why?", "Have you ever taken part in ecological projects at school?", "What would you recommend to a person who wants to improve the ecological situations in his or her hometown?"
    ]},
    { title: "31. Teenager's reading habits", questions: [
      "What kind of books do you like to read?", "Who is your favourite writer?", "How often do you borrow books from the library?", "Why do you think teenagers are reading less and less now?", "How can reading English books help students to improve their English?", "What book would you recommend to your friend who wants to read something for pleasure and why?"
    ]},
    { title: "32. Best Friend", questions: [
      "What is your best friend like?", "Where did you and your friend meet for the first time?", "How often do you see each other?", "What do you like to do together?", "What career is your best friend going to follow?", "What would you recommend to a teenager who wants to be a good friend?"
    ]},
    { title: "33. Pets and animals", questions: [
      "What is your favourite animal? Why do you like it?", "What pets are the most popular in Russia in your view?", "Is it right for people to keep exotic animals as pets? Why?", "What can people do to help homeless animals?", "Why do you think most children like visiting zoos?", "Does a career as a vet attract you or not? Why?"
    ]},
    { title: "34. Eating habits 2", questions: [
      "What is your favourite fruit?", "What do you usually have for breakfast?", "Where do you usually have lunch on weekdays?", "Is there any food you do not like?", "What dishes can you cook?", "What food would you recommend to a teenager who wants to be healthy?"
    ]},
    { title: "35. Daily routines 2", questions: [
      "When do you get up on weekdays?", "What do you prefer to eat for breakfast in the morning?", "How long does it take you to get to school?", "What is your favourite part of the day: morning, afternoon or evening? Why do you like it?", "What do you do to help your parents about the house?", "What would you recommend to teenagers who are often late for school?"
    ]},
    { title: "36. TV", questions: [
      "How many TV sets are there in your house?", "Who watches most TV in your family?", "How much time a day do you spend watching TV?", "What kind of TV programs do you like?", "Would you like to take part in a TV show? For example, in a quiz show? Why?", "Does a career on TV attract you or not? Why?"
    ]},
    { title: "37. Computers", questions: [
      "How old were you when you started using a computer?", "In what lessons at school do you use computers?", "What do you use your computer for?", "What do the members of your family use computers for?", "Which jobs need good computer skills in your view?", "In what way have computers made people's life easier?"
    ]},
    { title: "38. Using mobile phones", questions: [
      "How old are you?", "When did you get your first mobile phone?", "What do you usually use your mobile phone for?", "How do you feel when you forget your mobile phone at home?", "Do you think it's right that mobile phones are not allowed in some schools?", "In what places would you recommend people switch off or turn down their phones? Why?"
    ]},
    { title: "39. City, Town or Village 2", questions: [
      "Where is your hometown located?", "What is your hometown famous for?", "What is your favourite place in your hometown? Why do you like it?", "What environmental problems do you have in your hometown, if any?", "Is it better to live in the country or in the city? Why?", "What would you like to improve in your hometown, to make it a better place to live?"
    ]},
    { title: "40. Modern Film Industry", questions: [
      "How often do you go to the cinema?", "What kinds of films do you like most?", "Why do you think many people prefer watching films at home?", "What do you like to do in your free time?", "How can films in English help students improve their English?", "What film would you recommend your friends see and why?"
    ]}
  ];

  // Состояние
  let currentQuestions = [];
  let currentTopicTitle = "";
  let currentCardIndex = 0;
  let timeLeft = 40;
  let timerInterval;
  
  // Запись
  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;
  let recordedBuffers = []; 

  // DOM
  const cardQuestion = document.getElementById('card-question-text');
  const cardTopic = document.getElementById('card-topic');
  const cardProgress = document.getElementById('card-progress');
  const cardTimer = document.getElementById('card-timer');
  const cardUi = document.getElementById('card-ui');
  const recBtn = document.getElementById('rec-btn');
  const textAnswer = document.getElementById('text-answer');

  function initMenu() {
    const grid = document.getElementById('themes-grid');
    THEMES_DATA.forEach((theme, index) => {
      const btn = document.createElement('button');
      btn.className = 'theme-btn';
      btn.innerText = theme.title;
      btn.onclick = () => startMode('topic', index);
      grid.appendChild(btn);
    });
  }
  initMenu();

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function backToMenu() {
    if(isRecording) stopRecording();
    clearInterval(timerInterval);
    window.speechSynthesis.cancel(); // Остановить озвучку
    showScreen('screen-menu');
  }

  function startMode(mode, index = 0) {
    recordedBuffers = [];
    
    if (mode === 'random') {
      currentTopicTitle = "Random Mix";
      let allQ = THEMES_DATA.flatMap(t => t.questions);
      allQ.sort(() => Math.random() - 0.5);
      currentQuestions = allQ.slice(0, 6);
    } else {
      currentTopicTitle = THEMES_DATA[index].title;
      currentQuestions = THEMES_DATA[index].questions;
    }

    currentCardIndex = 0;
    showScreen('screen-exam');
    loadCard();
  }

  function loadCard() {
    textAnswer.value = '';
    cardUi.style.animation = 'none';
    cardUi.offsetHeight; 
    cardUi.style.animation = 'slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
    
    cardTopic.innerText = currentTopicTitle;
    cardProgress.innerText = `${currentCardIndex + 1} / 6`;
    cardQuestion.innerText = currentQuestions[currentCardIndex];

    // Автоматическая озвучка
    speakQuestion();
    
    startTimer();
  }

  function startTimer() {
    timeLeft = 40;
    cardTimer.innerText = timeLeft;
    clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
      timeLeft--;
      cardTimer.innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
      }
    }, 1000);
  }

  // --- ОЗВУЧКА ---
  function speakQuestion() {
    window.speechSynthesis.cancel(); // Сброс предыдущей озвучки
    const text = currentQuestions[currentCardIndex];
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-GB'; // Британский английский (как на ОГЭ)
    utterance.rate = 0.9; // Чуть медленнее для лучшего понимания
    window.speechSynthesis.speak(utterance);
  }

  async function nextCard() {
    if (isRecording) stopRecording();
    window.speechSynthesis.cancel(); // Прерываем озвучку при переходе
    
    await new Promise(r => setTimeout(r, 300));

    currentCardIndex++;
    if (currentCardIndex >= 6) {
      clearInterval(timerInterval);
      showScreen('screen-finish');
    } else {
      loadCard();
    }
  }

  // --- ЗАПИСЬ И MP3 ---
  async function toggleRecording() {
    if (isRecording) {
      stopRecording();
    } else {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          
          recBtn.innerText = "⏳ Processing...";
          
          try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await audioBlob.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            recordedBuffers.push(audioBuffer); 
          } catch (err) {
            console.error("Audio error", err);
          }
          
          recBtn.innerText = "🎤 Start Recording";
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
        recBtn.innerText = "⏹ Stop Recording";
      } catch (err) {
        alert("Microphone access denied.");
      }
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    isRecording = false;
    recBtn.classList.remove('recording');
  }

  async function downloadMp3() {
    if (recordedBuffers.length === 0) {
      alert("No audio recorded.");
      return;
    }

    const btn = document.querySelector('.mp3-btn');
    btn.innerText = "⏳ Mixing Audio...";
    btn.disabled = true;

    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      let totalLength = 0;
      const pauseSamples = audioContext.sampleRate * 1;

      recordedBuffers.forEach(buf => { totalLength += buf.length + pauseSamples; });

      const finalBuffer = audioContext.createBuffer(recordedBuffers[0].numberOfChannels, totalLength, audioContext.sampleRate);
      let offset = 0;

      for (let ch = 0; ch < finalBuffer.numberOfChannels; ch++) {
        const channelData = finalBuffer.getChannelData(ch);
        recordedBuffers.forEach(buf => {
          const data = buf.numberOfChannels > ch ? buf.getChannelData(ch) : buf.getChannelData(0);
          channelData.set(data, offset);
          offset += data.length + pauseSamples;
        });
        offset = 0; 
      }

      const left = finalBuffer.getChannelData(0);
      const right = finalBuffer.numberOfChannels > 1 ? finalBuffer.getChannelData(1) : left;
      const mp3encoder = new lamejs.Mp3Encoder(2, finalBuffer.sampleRate, 128);
      const mp3Data = [];
      const sampleBlockSize = 1152;

      function floatTo16BitPCM(input) {
        const output = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return output;
      }
      const left16 = floatTo16BitPCM(left);
      const right16 = floatTo16BitPCM(right);

      for (let i = 0; i < left16.length; i += sampleBlockSize) {
        const mp3buf = mp3encoder.encodeBuffer(left16.subarray(i, i + sampleBlockSize), right16.subarray(i, i + sampleBlockSize));
        if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
      }
      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));

      const url = URL.createObjectURL(new Blob(mp3Data, { type: 'audio/mp3' }));
      const a = document.createElement('a');
      a.href = url; 
      a.download = `${currentTopicTitle.replace(/\s+/g, '_')}_answers.mp3`; 
      a.click();
      URL.revokeObjectURL(url);
      
      btn.innerText = "⬇️ Download All Answers (MP3)";
      btn.disabled = false;
    } catch (e) {
      console.error(e);
      alert("Error mixing audio.");
      btn.innerText = "⬇️ Download All Answers (MP3)";
      btn.disabled = false;
    }
  }

  // --- ГЕНЕРАЦИЯ PDF ---
  function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Настройки шрифта
    doc.setFont("helvetica");
    
    THEMES_DATA.forEach((theme, index) => {
      if (index > 0) doc.addPage(); // Новая страница для каждой темы (всего 40)
      
      // Заголовок
      doc.setFontSize(22);
      doc.setTextColor(139, 92, 246); // Фиолетовый
      doc.text(theme.title, 20, 30);
      
      // Рамка
      doc.setDrawColor(6, 182, 212); // Голубой
      doc.setLineWidth(1);
      doc.rect(15, 15, 180, 260); // Рамка вокруг карточки
      
      // Вопросы
      doc.setFontSize(14);
      doc.setTextColor(40, 40, 40);
      
      let yPosition = 50;
      theme.questions.forEach((q, qIndex) => {
        // Разбиваем длинный текст на строки
        const splitText = doc.splitTextToSize(`${qIndex + 1}. ${q}`, 160);
        doc.text(splitText, 20, yPosition);
        yPosition += splitText.length * 8 + 15; // Отступ между вопросами
      });
      
      // Подпись внизу
      doc.setFontSize(10);
      doc.setTextColor(150, 150, 150);
      doc.text("Space Speaking Simulator - OGE Preparation", 20, 270);
      doc.text(`Page ${index + 1} of 40`, 160, 270);
    });

    doc.save("OGE_Speaking_40_Cards.pdf");
  }
</script>
